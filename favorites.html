<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta
    name="description"
    content="View and manage your favorite recipes."
  />

  <title>Favorite Recipes | Recipe Finder</title>

  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <header class="site-header">
    <div class="container header-content">
      <a href="index.html" class="logo">
        <span class="logo-icon">🍴</span>
        <span>Recipe Finder</span>
      </a>

      <nav class="main-nav" aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="favorites.html" class="active">Favorites ❤️</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="page-heading">
      <div class="container">
        <p class="eyebrow">Your collection</p>
        <h1>Favorite Recipes</h1>
        <p>
          Recipes you've saved for later.
        </p>
      </div>
    </section>

    <section class="recipes-section">
      <div class="container">
        <div id="favorites-status" class="status-message" aria-live="polite"></div>

        <div
          id="favorites-grid"
          class="recipe-grid"
          aria-live="polite"
        ></div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 Recipe Finder. Built for WDD 330.</p>
    </div>
  </footer>

  <script type="module" src="js/favorites.js"></script>
</body>
</html>
