<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta
    name="description"
    content="Find, discover, and save delicious recipes with Recipe Finder."
  />

  <title>Recipe Finder</title>

  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <header class="site-header">
    <div class="container header-content">
      <a href="index.html" class="logo">
        <span class="logo-icon">🍴</span>
        <span>Recipe Finder</span>
      </a>

      <nav class="main-nav" aria-label="Main navigation">
        <a href="index.html" class="active">Home</a>
        <a href="favorites.html">Favorites ❤️</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="container">
        <p class="eyebrow">Simple meals. Great ideas.</p>

        <h1>Find your next favorite recipe.</h1>

        <p class="hero-text">
          Search thousands of recipes and save the ones you want to try.
        </p>

        <form id="search-form" class="search-form">
          <label for="search-input" class="sr-only">
            Search for a recipe
          </label>

          <input
            type="search"
            id="search-input"
            placeholder="Search for chicken, pasta, rice..."
            autocomplete="off"
          />

          <button type="submit">
            Search
          </button>
        </form>
      </div>
    </section>

    <section class="categories-section">
      <div class="container">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Explore</p>
            <h2>Categories</h2>
          </div>
        </div>

        <div
          id="category-container"
          class="category-container"
          aria-label="Recipe categories"
        ></div>
      </div>
    </section>

    <section class="recipes-section">
      <div class="container">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Discover</p>
            <h2 id="results-title">Popular Recipes</h2>
          </div>
        </div>

        <div
          id="status-message"
          class="status-message"
          aria-live="polite"
        >
          Loading recipes...
        </div>

        <div
          id="recipe-grid"
          class="recipe-grid"
          aria-live="polite"
        ></div>
      </div>
    </section>
  </main>

  <div
    id="recipe-details"
    class="recipe-details"
    role="dialog"
    aria-modal="true"
    aria-labelledby="details-title"
  >
    <div class="recipe-details-modal">
      <button
        id="close-details"
        class="close-details"
        type="button"
        aria-label="Close recipe details"
      >
        &times;
      </button>

      <div id="details-content"></div>
    </div>
  </div>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 Recipe Finder. Built for WDD 330.</p>
    </div>
  </footer>

  <script type="module" src="js/main.js"></script>
</body>
</html>
