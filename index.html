<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Recipe Finder - Search and discover delicious recipes.">
  <title>Recipe Finder</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/main.js"></script>
</head>

<body>
  <header class="site-header">
    <div class="header-container">
      <a href="index.html" class="logo" aria-label="Recipe Finder home">
        <span class="logo-icon">🍴</span>
        <span>Recipe Finder</span>
      </a>

      <nav class="main-nav" aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="favorites.html" class="favorites-link">♡ Favorites</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="hero-content">
        <p class="eyebrow">DISCOVER SOMETHING DELICIOUS</p>

        <h1>Find your next<br><span>favorite recipe.</span></h1>

        <p class="hero-text">
          Search thousands of recipes and discover something delicious to make today.
        </p>

        <form id="search-form" class="search-form">
          <label for="search-input" class="visually-hidden">
            Search for a recipe
          </label>

          <input
            type="search"
            id="search-input"
            name="search"
            placeholder="Search for a recipe..."
            autocomplete="off"
          >

          <button type="submit">
            Search
          </button>
        </form>
      </div>
    </section>

    <section class="recipes-section">
      <div class="section-heading">
        <div>
          <p class="eyebrow">EXPLORE</p>
          <h2 id="results-title">Popular Recipes</h2>
        </div>
      </div>

      <div id="status-message" class="status-message" aria-live="polite">
        Loading recipes...
      </div>

      <div id="recipe-grid" class="recipe-grid"></div>
    </section>

    <section id="recipe-details" class="recipe-details hidden" aria-hidden="true">
      <div class="details-container">
        <button
          type="button"
          id="close-details"
          class="close-details"
          aria-label="Close recipe details"
        >
          ×
        </button>

        <div id="details-content"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 Recipe Finder</p>
    <p>Powered by TheMealDB</p>
  </footer>
</body>
</html>
